name: Tests
on:
  pull_request:
    paths:
      - "backend/**"
      - "e2e/**"
      - ".github/workflows/test.yml"
      - "docker-compose.yml"
  push:
    branches: [main, devin/**]
    paths:
      - "backend/**"
      - "e2e/**"
      - ".github/workflows/test.yml"
      - "docker-compose.yml"
  workflow_dispatch:

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv pip install --system fastapi uvicorn[standard] sqlalchemy pydantic pydantic-settings python-dotenv httpx aiosqlite python-multipart pytest pytest-asyncio

      - name: Run tests
        run: PYTHONPATH=$PWD python -m pytest tests/ -v --junitxml=results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit
          path: backend/results.xml

  docker-e2e:
    name: Docker E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start Docker stack
        run: docker compose up -d --wait --wait-timeout 60

      - name: Run E2E test
        run: python e2e/test_docker_stack.py

      - name: Capture logs on failure
        if: failure()
        run: |
          docker compose logs backend --tail 100 > /tmp/backend-log.txt
          docker compose logs frontend --tail 100 > /tmp/frontend-log.txt

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-e2e-logs
          path: /tmp/*-log.txt

      - name: Teardown
        if: always()
        run: docker compose down -v

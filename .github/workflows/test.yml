name: Backend Tests
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/test.yml"
  push:
    branches: [main, devin/**]
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv pip install --system fastapi uvicorn[standard] sqlalchemy pydantic pydantic-settings python-dotenv httpx aiosqlite python-multipart pytest pytest-asyncio

      - name: Run tests
        run: PYTHONPATH=$PWD python -m pytest tests/ -v --junitxml=results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/results.xml
